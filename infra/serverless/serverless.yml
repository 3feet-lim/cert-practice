# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: 3feetlim
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: certforge
service: certforge-api
configValidationMode: error

# pg's CommonJS dynamic requires must remain executable in the Lambda bundle.
build:
  esbuild:
    format: cjs

stages:
  default:
    params:
      dsqlDatabase: postgres
      dsqlUser: app
      monthlyBudgetUsd: 100

plugins:
  - serverless-offline

custom:
  telemetryNamespace: ${env:CERTFORGE_TELEMETRY_NAMESPACE, 'CertForge/${sls:stage}'}
  telemetryService: ${env:CERTFORGE_TELEMETRY_SERVICE, 'certforge-api'}
  serverless-offline:
    host: 127.0.0.1
    httpPort: 3000
    noPrependStageInUrl: true
    ignoreJWTSignature: true
  runbookBaseUrl: ${env:CERTFORGE_RUNBOOK_BASE_URL, 'https://github.com/certforge/cert-practice/blob/main/infra/serverless/runbooks'}
  runbooks:
    api5xx: ${self:custom.runbookBaseUrl}/api-5xx.md
    finalizeFailure: ${self:custom.runbookBaseUrl}/finalize-failure.md
    cleanupFailure: ${self:custom.runbookBaseUrl}/cleanup-failure.md
    importRollback: ${self:custom.runbookBaseUrl}/import-rollback.md
    projectionLeak: ${self:custom.runbookBaseUrl}/projection-leak.md
    dbLatency: ${self:custom.runbookBaseUrl}/db-latency.md
    budget: ${self:custom.runbookBaseUrl}/budget.md

provider:
  name: aws
  runtime: nodejs22.x
  architecture: x86_64
  region: ${opt:region, "ap-northeast-2"}
  stage: ${opt:stage, "dev"}
  versionFunctions: true
  timeout: 29
  memorySize: 256
  logRetentionInDays: 30
  iam:
    # Terraform owns this permanent role; the local runner injects harmless stand-ins.
    role: ${env:CERTFORGE_LAMBDA_ROLE_ARN, ssm:/certforge/${sls:stage}/lambda-role-arn}
  httpApi:
    # API Gateway applies this to authorizer rejections before requests reach Hono.
    # WEB_ORIGIN is the exact Terraform-published SPA origin; never use wildcards.
    cors:
      allowedOrigins:
        - ${env:CERTFORGE_WEB_ORIGIN, ssm:/certforge/${sls:stage}/web-origin}
      allowedHeaders:
        - authorization
        - content-type
        - x-request-id
        - idempotency-key
      allowedMethods:
        - GET
        - POST
        - PATCH
        - OPTIONS
      maxAge: 600
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.authorization
        issuerUrl: ${env:CERTFORGE_COGNITO_ISSUER, ssm:/certforge/${sls:stage}/cognito-issuer}
        audience:
          - ${env:CERTFORGE_COGNITO_CLIENT_ID, ssm:/certforge/${sls:stage}/cognito-client-id}
  environment:
    STAGE: ${sls:stage}
    CERTFORGE_LOCAL_EMULATION: ${env:CERTFORGE_LOCAL_EMULATION, 'false'}
    # Dev infrastructure is the Terraform-owned Aurora DSQL target; deployment does not depend on a historical report artifact.
    CERT_QUIZ_DATABASE_ADAPTER: dsql
    DSQL_ENDPOINT: ${env:CERTFORGE_DSQL_ENDPOINT, ssm:/certforge/${sls:stage}/dsql-endpoint}
    DSQL_DATABASE: ${param:dsqlDatabase}
    DSQL_USER: ${param:dsqlUser}
    COGNITO_ISSUER: ${env:CERTFORGE_COGNITO_ISSUER, ssm:/certforge/${sls:stage}/cognito-issuer}
    COGNITO_CLIENT_ID: ${env:CERTFORGE_COGNITO_CLIENT_ID, ssm:/certforge/${sls:stage}/cognito-client-id}
    # Terraform publishes exact stage origins; Hono performs the final exact-origin check.
    WEB_ORIGIN: ${env:CERTFORGE_WEB_ORIGIN, ssm:/certforge/${sls:stage}/web-origin}
    MARKDOWN_IMAGE_ORIGINS: ${env:CERTFORGE_MARKDOWN_IMAGE_ORIGINS, ssm:/certforge/${sls:stage}/markdown-image-origins}
    # DynamoDB supplies a shared durable limit across all Lambda instances.
    RATE_LIMIT_TABLE: ${env:CERTFORGE_RATE_LIMIT_TABLE, ssm:/certforge/${sls:stage}/rate-limit-table-name}
    RATE_LIMIT_POLICIES: ${env:CERTFORGE_RATE_LIMIT_POLICIES, ssm:/certforge/${sls:stage}/rate-limit-policies}
    # CloudWatch Embedded Metric Format is emitted through the existing Lambda log permission.
    TELEMETRY_NAMESPACE: ${self:custom.telemetryNamespace}
    TELEMETRY_SERVICE: ${self:custom.telemetryService}
    NODE_OPTIONS: --enable-source-maps
  stackTags:
    Service: certforge
    Environment: ${sls:stage}
    ManagedBy: serverless-framework
  tags:
    Service: certforge
    Environment: ${sls:stage}
    ManagedBy: serverless-framework

package:
  individually: true

functions:
  api:
    name: certforge-${sls:stage}-api
    description: CertForge Hono API
    handler: handler.handler
    events:
      # Health and browser preflight are public. API Gateway CORS adds the
      # configured headers to authorizer rejections; Hono applies the same
      # exact-origin policy to Lambda-served preflight and route responses.
      - httpApi:
          path: /v1/health
          method: GET
      - httpApi:
          path: /v1/{proxy+}
          method: OPTIONS
      - httpApi:
          path: /v1/{proxy+}
          method: "*"
          authorizer:
            name: cognitoJwt
  practiceRetention:
    name: certforge-${sls:stage}-practice-retention
    description: Deletes expired completed practice results; it never finalizes exams.
    handler: handler.practiceRetentionHandler
    timeout: 29
    events:
      - eventBridge:
          schedule: rate(1 hour)
          enabled: true

resources:
  Resources:
    OperationsDashboard:
      Type: AWS::CloudWatch::Dashboard
      Properties:
        DashboardName: certforge-${sls:stage}-operations
        DashboardBody:
          Fn::Sub: |
            {"widgets":[
              {"type":"metric","properties":{"title":"API health","region":"${AWS::Region}","view":"timeSeries","stat":"Sum","period":300,"metrics":[["${self:custom.telemetryNamespace}","ApiRequests","Service","${self:custom.telemetryService}","Stage","${sls:stage}"],[".","Api5xx",".",".",".","."]]}},
              {"type":"metric","properties":{"title":"Finalize and cleanup","region":"${AWS::Region}","view":"timeSeries","stat":"Sum","period":300,"metrics":[["${self:custom.telemetryNamespace}","FinalizeFailures","Service","${self:custom.telemetryService}","Stage","${sls:stage}"],[".","CleanupFailures",".",".",".","."],[".","CleanupDeleted",".",".",".","."]]}},
              {"type":"metric","properties":{"title":"Import and projection guards","region":"${AWS::Region}","view":"timeSeries","stat":"Sum","period":300,"metrics":[["${self:custom.telemetryNamespace}","ImportRollbacks","Service","${self:custom.telemetryService}","Stage","${sls:stage}"],[".","ProjectionSchemaFailures",".",".",".","."]]}},
              {"type":"metric","properties":{"title":"Database latency","region":"${AWS::Region}","view":"timeSeries","stat":"p95","period":300,"metrics":[["${self:custom.telemetryNamespace}","DbConnectLatencyMs","Service","${self:custom.telemetryService}","Stage","${sls:stage}"],[".","DbTransactionLatencyMs",".",".",".","."]]}}
            ]}
    Api5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Metadata:
        RunbookUrl: ${self:custom.runbooks.api5xx}
      Properties:
        AlarmName: certforge-${sls:stage}-api-5xx
        AlarmDescription: '{"runbook":"${self:custom.runbooks.api5xx}","firstResponse":"Correlate request IDs and consider Lambda alias rollback."}'
        Namespace: ${self:custom.telemetryNamespace}
        MetricName: Api5xx
        Dimensions:
          - Name: Service
            Value: ${self:custom.telemetryService}
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 3
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    FinalizeFailureAlarm:
      Type: AWS::CloudWatch::Alarm
      Metadata:
        RunbookUrl: ${self:custom.runbooks.finalizeFailure}
      Properties:
        AlarmName: certforge-${sls:stage}-finalize-failure
        AlarmDescription: '{"runbook":"${self:custom.runbooks.finalizeFailure}","firstResponse":"Verify Attempt cardinality and retryable session state."}'
        Namespace: ${self:custom.telemetryNamespace}
        MetricName: FinalizeFailures
        Dimensions:
          - Name: Service
            Value: ${self:custom.telemetryService}
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    CleanupFailureAlarm:
      Type: AWS::CloudWatch::Alarm
      Metadata:
        RunbookUrl: ${self:custom.runbooks.cleanupFailure}
      Properties:
        AlarmName: certforge-${sls:stage}-cleanup-failure
        AlarmDescription: '{"runbook":"${self:custom.runbooks.cleanupFailure}","firstResponse":"Check EventBridge, Lambda permissions, and rerun bounded cleanup."}'
        Namespace: ${self:custom.telemetryNamespace}
        MetricName: CleanupFailures
        Dimensions:
          - Name: Service
            Value: ${self:custom.telemetryService}
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 7200
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    ImportRollbackAlarm:
      Type: AWS::CloudWatch::Alarm
      Metadata:
        RunbookUrl: ${self:custom.runbooks.importRollback}
      Properties:
        AlarmName: certforge-${sls:stage}-import-rollback
        AlarmDescription: '{"runbook":"${self:custom.runbooks.importRollback}","firstResponse":"Confirm catalog head and validation-token state before retrying."}'
        Namespace: ${self:custom.telemetryNamespace}
        MetricName: ImportRollbacks
        Dimensions:
          - Name: Service
            Value: ${self:custom.telemetryService}
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    ProjectionLeakGuardAlarm:
      Type: AWS::CloudWatch::Alarm
      Metadata:
        RunbookUrl: ${self:custom.runbooks.projectionLeak}
      Properties:
        AlarmName: certforge-${sls:stage}-projection-leak-guard
        AlarmDescription: '{"runbook":"${self:custom.runbooks.projectionLeak}","firstResponse":"Stop deployment progression and roll back without collecting response payloads."}'
        Namespace: ${self:custom.telemetryNamespace}
        MetricName: ProjectionSchemaFailures
        Dimensions:
          - Name: Service
            Value: ${self:custom.telemetryService}
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    DbLatencyAlarm:
      Type: AWS::CloudWatch::Alarm
      Metadata:
        RunbookUrl: ${self:custom.runbooks.dbLatency}
      Properties:
        AlarmName: certforge-${sls:stage}-db-latency
        AlarmDescription: '{"runbook":"${self:custom.runbooks.dbLatency}","firstResponse":"Inspect connector pool and query-plan evidence against the 500 ms gate."}'
        Namespace: ${self:custom.telemetryNamespace}
        MetricName: DbConnectLatencyMs
        Dimensions:
          - Name: Service
            Value: ${self:custom.telemetryService}
          - Name: Stage
            Value: ${sls:stage}
        ExtendedStatistic: p95
        Period: 300
        EvaluationPeriods: 3
        DatapointsToAlarm: 3
        Threshold: 500
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
    BudgetAlarm:
      Type: AWS::CloudWatch::Alarm
      Metadata:
        RunbookUrl: ${self:custom.runbooks.budget}
      Properties:
        AlarmName: certforge-${sls:stage}-budget
        AlarmDescription: '{"runbook":"${self:custom.runbooks.budget}","firstResponse":"Review traffic, log retention, and DSQL consumption."}'
        Namespace: AWS/Billing
        MetricName: EstimatedCharges
        Dimensions:
          - Name: Currency
            Value: USD
        Statistic: Maximum
        Period: 21600
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: ${param:monthlyBudgetUsd}
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
