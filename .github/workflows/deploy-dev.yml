name: Deploy DEV API and SPA on main

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  # Shares the manual DEV release lock so the two deployment paths cannot overlap.
  group: certquiz-dev-release
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy DEV API and SPA
    runs-on: ubuntu-latest
    environment: release-dev
    env:
      CERTQUIZ_STAGE: dev
      CERTQUIZ_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CERTQUIZ_RELEASE_ROLE_ARN }}
          aws-region: ap-northeast-2
      - run: pnpm install --frozen-lockfile
      - name: Build DEV deployment dependencies
        run: |
          pnpm --filter @cert-quiz/contracts build
          pnpm --filter @cert-quiz/domain build
          pnpm --filter @cert-quiz/db build
          pnpm --filter @cert-quiz/api build
      - name: Apply and verify DEV DSQL migrations
        run: |
          export DSQL_ENDPOINT="$(aws ssm get-parameter --name /certquiz/dev/dsql-endpoint --query Parameter.Value --output text)"
          export DSQL_DATABASE=postgres
          export DSQL_USER=admin
          export CERTQUIZ_LAMBDA_ROLE_ARN="$(aws ssm get-parameter --name /certquiz/dev/lambda-role-arn --query Parameter.Value --output text)"
          export CERTQUIZ_APP_DB_ROLE=app
          pnpm --filter @cert-quiz/db run migrate:deploy
      - name: Deploy DEV Serverless API
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: |
          export CERTQUIZ_LAMBDA_ROLE_ARN="$(aws ssm get-parameter --name /certquiz/dev/lambda-role-arn --query Parameter.Value --output text)"
          export CERTQUIZ_DSQL_ENDPOINT="$(aws ssm get-parameter --name /certquiz/dev/dsql-endpoint --query Parameter.Value --output text)"
          pnpm --dir infra/serverless exec node run-serverless.mjs deploy --stage dev --region ap-northeast-2 --param="lambdaRoleArn=$CERTQUIZ_LAMBDA_ROLE_ARN" --param="databaseEndpoint=$CERTQUIZ_DSQL_ENDPOINT"
      - name: Smoke deployed DEV infrastructure
        run: |
          export CERTQUIZ_DEPLOYED_WEB_ORIGIN="$(aws ssm get-parameter --name /certquiz/dev/web-origin --query Parameter.Value --output text)"
          pnpm infra:smoke
      - name: Resolve DEV SPA runtime configuration
        id: web-runtime
        run: |
          api_base_url="$(aws cloudformation describe-stacks --stack-name certquiz-api-dev --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue | [0]" --output text)"
          cognito_hosted_ui_base_url="$(aws ssm get-parameter --name /certquiz/dev/cognito-hosted-ui-base-url --query Parameter.Value --output text)"
          cognito_client_id="$(aws ssm get-parameter --name /certquiz/dev/cognito-client-id --query Parameter.Value --output text)"
          test -n "$api_base_url" && test "$api_base_url" != "None"
          test -n "$cognito_hosted_ui_base_url" && test "$cognito_hosted_ui_base_url" != "None"
          test -n "$cognito_client_id" && test "$cognito_client_id" != "None"
          echo "api_base_url=$api_base_url" >> "$GITHUB_OUTPUT"
          echo "cognito_hosted_ui_base_url=$cognito_hosted_ui_base_url" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$cognito_client_id" >> "$GITHUB_OUTPUT"
      - name: Build DEV SPA with public runtime configuration
        env:
          VITE_CERTQUIZ_RUNTIME_MODE: http
          VITE_CERTQUIZ_API_BASE_URL: ${{ steps.web-runtime.outputs.api_base_url }}
          VITE_CERTQUIZ_COGNITO_HOSTED_UI_BASE_URL: ${{ steps.web-runtime.outputs.cognito_hosted_ui_base_url }}
          VITE_CERTQUIZ_COGNITO_CLIENT_ID: ${{ steps.web-runtime.outputs.cognito_client_id }}
          VITE_CERTQUIZ_AUTH_REDIRECT_PATH: /auth/callback
          VITE_CERTQUIZ_AUTH_LOGOUT_PATH: /login
        run: pnpm --filter @cert-quiz/web build
      - name: Resolve DEV SPA delivery targets
        id: web-targets
        run: |
          echo "bucket=$(aws ssm get-parameter --name /certquiz/dev/web-bucket-name --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(aws ssm get-parameter --name /certquiz/dev/cloudfront-distribution-id --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
      - name: Sync DEV SPA assets
        env:
          WEB_BUCKET: ${{ steps.web-targets.outputs.bucket }}
        run: |
          aws s3 sync apps/web/dist "s3://$WEB_BUCKET" --delete --exclude "index.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 cp apps/web/dist/index.html "s3://$WEB_BUCKET/index.html" --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"
      - name: Invalidate DEV SPA distribution
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.web-targets.outputs.distribution }}
        run: |
          invalidation_id="$(aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths / /index.html '/assets/*' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$invalidation_id"
