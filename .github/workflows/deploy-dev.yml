name: Deploy DEV API code on main

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  # Shares the manual DEV release lock so the two deployment paths cannot overlap.
  group: certquiz-dev-release
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy DEV API code
    runs-on: ubuntu-latest
    environment: release-dev
    env:
      CERTQUIZ_STAGE: dev
      CERTQUIZ_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CERTQUIZ_RELEASE_ROLE_ARN }}
          aws-region: ap-northeast-2
      - run: pnpm install --frozen-lockfile
      - name: Deploy DEV Serverless API
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: |
          export CERTQUIZ_LAMBDA_ROLE_ARN="$(aws ssm get-parameter --name /certquiz/dev/lambda-role-arn --query Parameter.Value --output text)"
          export CERTQUIZ_DSQL_ENDPOINT="$(aws ssm get-parameter --name /certquiz/dev/dsql-endpoint --query Parameter.Value --output text)"
          pnpm --dir infra/serverless exec node run-serverless.mjs deploy --stage dev --region ap-northeast-2 --param="lambdaRoleArn=$CERTQUIZ_LAMBDA_ROLE_ARN" --param="databaseEndpoint=$CERTQUIZ_DSQL_ENDPOINT"
      - name: Smoke deployed DEV infrastructure
        run: pnpm infra:smoke
