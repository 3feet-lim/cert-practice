name: Release candidate gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pr-static:
    name: Always-on PR static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:pr

  dsql-adapter:
    name: Protected DSQL adapter validation
    runs-on: ubuntu-latest
    needs: pr-static
    environment: db-adapter-validation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CERTFORGE_RELEASE_ROLE_ARN }}
          aws-region: ap-northeast-2
      - run: pnpm install --frozen-lockfile
      - id: gate-started
        run: echo "iso=$(node -p 'new Date().toISOString()')" >> "$GITHUB_OUTPUT"
      - run: pnpm ci:db-adapter
        env:
          DSQL_ENDPOINT: ${{ secrets.CERTFORGE_DSQL_ENDPOINT }}
          DSQL_DATABASE: ${{ secrets.CERTFORGE_DSQL_DATABASE }}
          DSQL_USER: ${{ secrets.CERTFORGE_DSQL_USER }}
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
          CERTFORGE_DSQL_SPIKE_NOT_BEFORE: ${{ steps.gate-started.outputs.iso }}
      - uses: actions/upload-artifact@v4
        with:
          name: db-adapter-evidence
          path: artifacts/dsql-spike/

  deployment-candidate:
    name: Protected deployment candidate gates
    runs-on: ubuntu-latest
    needs: dsql-adapter
    environment: deployment-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CERTFORGE_RELEASE_ROLE_ARN }}
          aws-region: ap-northeast-2
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:cognito-integration
        env:
          DSQL_DATABASE: ${{ secrets.CERTFORGE_DSQL_DATABASE }}
          DSQL_USER: ${{ secrets.CERTFORGE_DSQL_USER }}
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
      - run: pnpm ci:real-e2e
      - run: pnpm infra:plan
      - run: pnpm infra:package
